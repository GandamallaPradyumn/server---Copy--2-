# nginx_security.conf
# Nginx Configuration File for Telangana Government Portal (TSOC Compliance)
# Includes Security Headers (S.No 5), Clickjacking Defense (S.No 6), and SSL/TLS (S.No 7)

server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS (S.No 7)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # SSL Certificate Configuration (S.No 7)
    # ssl_certificate /etc/ssl/certs/tgsrtc.crt;
    # ssl_certificate_key /etc/ssl/certs/tgsrtc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---------- TSOC MANDATORY SECURITY HEADERS (S.No 5 & 6) ----------
    # 1. HSTS: Enforces HTTPS connections (S.No 5 & 7)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 2. X-Content-Type-Options: Prevents MIME-sniffing (S.No 5)
    add_header X-Content-Type-Options "nosniff" always;

    # 3. X-Frame-Options: Protects against Clickjacking (S.No 6)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 4. Content-Security-Policy (CSP): XSS and Code Injection Protection (S.No 5 & 6)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors 'self';" always;

    # 5. X-XSS-Protection: Cross-Site Scripting Filter
    add_header X-XSS-Protection "1; mode=block" always;

    # 6. Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy settings to Streamlit Application (default port 8501)
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
